default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "buscamais") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  socket: /var/run/mysqld/mysqld.sock

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "buscamais") %>

test:
  <<: *default
  database: buscamais_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "buscamais") %>
  cache:
    <<: *primary_production
    database: buscamais_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: buscamais_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: buscamais_cable
    migrations_paths: db/cable_migrate
