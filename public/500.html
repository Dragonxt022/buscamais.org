<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Erro temporário - Busca Mais</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .card { max-width: 520px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.05); }
    .code { font-size: 64px; font-weight: 900; color: #dc2626; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #6b7280; line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">500</div>
    <h1>Algo deu errado</h1>
    <p>Estamos com um problema temporário. Tente novamente em alguns instantes ou volte para a página inicial.</p>
    <a href="/">Ir para a home</a>
  </main>
</body>
</html>
