<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada - Busca Mais</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .card { max-width: 520px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.05); }
    .code { font-size: 64px; font-weight: 900; color: #2563eb; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #6b7280; line-height: 1.6; margin: 0 0 24px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #f3f4f6; color: #374151; }
    form { display: flex; gap: 8px; margin: 24px 0 0; }
    input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #111827; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido. Use os links abaixo para continuar lendo o Busca Mais.</p>
    <div class="links">
      <a class="primary" href="/">Ir para a home</a>
      <a class="secondary" href="/noticias">Todas as notícias</a>
    </div>
    <form action="/busca" method="get">
      <input type="search" name="q" placeholder="Buscar notícias..." aria-label="Buscar notícias">
      <button type="submit">Buscar</button>
    </form>
  </main>
</body>
</html>
